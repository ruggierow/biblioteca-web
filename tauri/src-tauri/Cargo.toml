[package]
name = "biblioteca-tauri-lib"
version = "1.8.3"
edition = "2021"
description = "Biblioteca — motor Windows (Tauri)"
authors = ["Ruggierow"]

[lib]
name = "biblioteca_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "biblioteca-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
dirs = "5"
# registro de exclusoes de fotos (comum/exclusao-de-fotos.md)
serde_json = "1"
# pinado — não fazer upgrade sem verificar tauri-build compatibility
time = "=0.3.51"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
