name: Biblioteca-Mac
options:
  bundleIdPrefix: com.ruggierow
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  BibliotecaWeb:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Sources/BibliotecaMacWeb
        excludes:
          - "Resources/**"
          - "*.plist"
          - "*.entitlements"
      - path: Sources/BibliotecaMacWeb/Resources/biblioteca.html
        buildPhase: resources
      - path: Sources/BibliotecaMacWeb/Resources/AppIcon.icns
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ruggierow.biblioteca-web
        PRODUCT_NAME: "Biblioteca Web"
        INFOPLIST_FILE: Sources/BibliotecaMacWeb/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/BibliotecaMacWeb/BibliotecaMacWeb.entitlements
        SWIFT_EMIT_LOC_STRINGS: YES
        DEVELOPMENT_TEAM: F6WL57SVMU
        CODE_SIGN_STYLE: Automatic
